// --- Cola de sincronización -------------------------------------------------
function configurado() { return !!(state.ajustes.url && state.ajustes.token); }
const sync = { enCurso: false, error: '', ultima: LS.get('syncUltima', null), msgAjustes: null, msgCopia: null, importPendiente: null };

// Un elemento por registro (k). Los cambios del mismo registro se fusionan.
function encolar(k, accion, datos, ref) {
  const i = state.cola.findIndex((c) => c.k === k);
  if (i >= 0) Object.assign(state.cola[i].datos, datos);
  else state.cola.push({ k, accion, datos: Object.assign({}, datos), ref: ref || null });
  LS.set('cola', state.cola); pintarSync(); sincronizar();
}
function encolarDia(iso, cambios) {
  if (!enCurso(parseISO(iso))) { pintarSync(); return; }     // fuera del curso no hay fila en la hoja
  encolar('dia:' + iso, 'dia', Object.assign({ fecha: iso, fase: state.ajustes.fase }, cambios));
}
function errorLegible(e) {
  const m = (e && e.message) || String(e);
  if (/Failed to fetch|NetworkError|Load failed|network|fetch/i.test(m)) return 'sin conexión o URL incorrecta';
  return m;
}
// POST con text/plain (evita el preflight de CORS con Apps Script) y redirect: 'follow'.
async function llamarScript(metodo, cuerpo) {
  const { url, token } = state.ajustes;
  let res;
  if (metodo === 'GET') {
    const q = new URLSearchParams(Object.assign({ token }, cuerpo)).toString();
    res = await fetch(url + (url.includes('?') ? '&' : '?') + q, { method: 'GET', redirect: 'follow' });
  } else {
    res = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ token }, cuerpo)) });
  }
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('la URL no responde JSON (¿es la que termina en /exec?)'); }
  if (!j.ok) { const err = new Error(j.error || 'error del script'); err.codigo = j.codigo; throw err; }
  return j;
}
// Antes de enviar se completan las claves que la hoja ya conoce (id de operación, fila de candidata).
function prepararEnvio(item) {
  if (item.accion === 'operacion' && item.ref) {
    const op = state.operaciones.find((o) => o.uid === item.ref);
    if (op && op.id != null) item.datos.id = op.id;
  }
  if (item.accion === 'candidata' && item.ref) {
    const c = state.candidatas.find((x) => x.uid === item.ref);
    if (c && c.fila != null) item.datos.fila = c.fila;
  }
  return item.datos;
}
async function sincronizar() {
  if (sync.enCurso || !configurado() || !state.cola.length) { pintarSync(); return; }
  sync.enCurso = true; pintarSync();
  let nuevosIds = false;   // si la hoja devuelve id o fila, las etiquetas "sin enviar" cambian
  try {
    while (state.cola.length) {
      const item = state.cola[0];
      let j;
      try { j = await llamarScript('POST', { accion: item.accion, datos: prepararEnvio(item) }); }
      catch (e) {
        // Lo que la hoja nunca podrá aceptar se descarta para no bloquear la cola.
        if (/fecha no encontrada|fecha inválida|acción desconocida|id fuera|id inválido/i.test(e.message || '')) {
          state.cola.shift(); LS.set('cola', state.cola); sync.error = `${item.k}: ${e.message}`; continue;
        }
        throw e;
      }
      if (item.accion === 'operacion' && item.ref && j.id != null) {
        const op = state.operaciones.find((o) => o.uid === item.ref);
        if (op && op.id == null) { op.id = j.id; LS.set('operaciones', state.operaciones); nuevosIds = true; }
      }
      if (item.accion === 'candidata' && item.ref && j.fila != null) {
        const c = state.candidatas.find((x) => x.uid === item.ref);
        if (c && c.fila == null) { c.fila = j.fila; LS.set('candidatas', state.candidatas); nuevosIds = true; }
      }
      state.cola.shift(); LS.set('cola', state.cola); sync.error = '';
    }
    sync.ultima = Date.now(); LS.set('syncUltima', sync.ultima);
  } catch (e) { sync.error = errorLegible(e); }
  sync.enCurso = false;
  if (nuevosIds && !state.pantalla) render(); else pintarSync();
}
function estadoSync() {

  if (!configurado()) return ['idle', 'Sin configurar' + pend, 'toca para ir a Ajustes'];
  if (sync.enCurso) return ['pend', 'Enviando…', ''];
  if (sync.error) return ['err', 'Error: ' + sync.error + pend, 'toca para reintentar'];
  if (n) return ['pend', `${n} pendiente${n > 1 ? 's' : ''}`, 'toca para reintentar'];
  const h = sync.ultima ? new Date(sync.ultima).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '';

}

// --- Operaciones, candidatas y demás registros ------------------------------
function ratioDe(o) {
  const e = num(o.entrada), s = num(o.stop), t = num(o.tp1);
  if (e === '' || s === '' || t === '' || e === s) return null;
  return Math.abs(t - e) / Math.abs(e - s);
}
function checklistOK(o) { return ['c1', 'c2', 'c3', 'c4', 'c5'].every((k) => !!o[k]); }
function cerrada(o) { return String(o.fechaCierre || '') !== '' || num(o.resultadoR) !== ''; }

function rDeSalida(o, salida) {

    motivo: o.motivo || '', aprendizaje: o.aprendizaje || '' };

// Guarda en local y encola. Sin "campos", manda la operación entera; con "campos", solo esos

// --- Riesgo (solo informativo, calculado en local) --------------------------
function faseCuenta(c) {
  const f = state.cuentas.find((x) => String(x.cuenta).trim() === c);
  return String((f && f.fase) || FASE_CUENTA_DEFECTO[c] || '').trim().toLowerCase();
}
function limiteCuenta(c) { return faseCuenta(c) === 'challenge' ? RIESGO.abiertoChallenge : RIESGO.abiertoMax; }
// Posiciones abiertas de swing en una cuenta (una en break even sigue siendo posición).
function posicionesCuenta(c, excluirUid) {
  return abiertas().filter((o) => o.uid !== excluirUid && o.tipo !== 'scalping' && (o.cuentas || []).includes(c)).length;
}
// Riesgo abierto de una cuenta: suma del riesgo % de las abiertas que no están en break even.
function riesgoCuenta(c, excluirUid) {
  return abiertas().filter((o) => o.uid !== excluirUid && !o.be && (o.cuentas || []).includes(c))
    .reduce((t, o) => t + (num(o.riesgo) || 0), 0);

function resumenRiesgo() {

  return cuentas.map((c) => ({ cuenta: c, riesgo: riesgoCuenta(c), limite: limiteCuenta(c), posiciones: posicionesCuenta(c), fase: faseCuenta(c) }));

function riesgoPropuesto(o) {

// Estado de validación del formulario de operación: bloqueos y avisos.
function validarOp(p) {

  else if (!/^\d{4}-\d{2}-\d{2}$/.test(o.fechaApertura || '')) r.duro = 'Falta la fecha.';
  else if (!(o.cuentas || []).length) r.duro = 'Elige al menos una cuenta.';
  else if (num(o.entrada) === '' || num(o.stop) === '') r.duro = 'Faltan la entrada y el stop.';
  else if (!(num(o.riesgo) > 0)) r.duro = 'Falta el riesgo %.';
  if (nueva && o.tipo !== 'scalping') {
    const llenas = (o.cuentas || []).filter((c) => posicionesCuenta(c, o.uid) >= RIESGO.maxPosiciones);
    if (llenas.length) r.duro = `Máximo tres posiciones: ${llenas.join(', ')} ya tiene${llenas.length > 1 ? 'n' : ''} tres abiertas.`;
    else {
      const dos = (o.cuentas || []).filter((c) => posicionesCuenta(c, o.uid) === 2);
      if (dos.length) {
        const ch = dos.filter((c) => faseCuenta(c) === 'challenge');
        r.avisos.push({ cls: '', t: `Tercera posición en ${dos.join(', ')}: riesgo 0,75 %.` + (ch.length ? ` En challenge (${ch.join(', ')}) el plan dice 1 % siempre.` : '') });
      }
    }
    const d = diaSemana(parseISO(o.fechaApertura || fechaISO(hoy())));
    if (d >= 4) r.avisos.push({ cls: '', t: d === 4 ? 'Viernes: solo gestión, sin aperturas.' : 'Fin de semana: nada de aperturas.' });
  }
  if (nueva && o.tipo === 'scalping') {
    const hoyN = state.operaciones.filter((x) => x.tipo === 'scalping' && x.fechaApertura === o.fechaApertura && x.uid !== o.uid).length;
    if (hoyN >= RIESGO.scalpingDia) r.avisos.push({ cls: 'rojo', t: `Ya hay ${hoyN} operaciones de scalping este día: el máximo es ${RIESGO.scalpingDia}.` });
  }
  const ratio = ratioDe(o);
  if (nueva) {
    if (ratio == null) { if (!r.duro) r.duro = 'Falta el TP1 para calcular el ratio.'; }
    else if (ratio < RATIO_MINIMO) r.blandos.push(`ratio 1:${fmt(ratio, 2)} por debajo de 1:${RATIO_MINIMO}`);
    if (!checklistOK(o)) r.blandos.push(`checklist incompleta (${['c1', 'c2', 'c3', 'c4', 'c5'].filter((k) => o[k]).length} de 5)`);
  }
  // Riesgo abierto resultante en cada cuenta (informativo)
  (o.cuentas || []).forEach((c) => {

    if (tot > lim + 1e-9) r.avisos.push({ cls: 'rojo', t: `${c}: el riesgo abierto quedaría en ${fmt(tot, 2)} % (máximo ${fmt(lim, 2)} %${lim === RIESGO.abiertoChallenge ? ', challenge' : ''}).` });
  });
  if (nueva && (o.cuentas || []).some((c) => CUENTAS_NOTICIAS.includes(c))) r.avisos.push({ cls: 'info', t: AVISO_NOTICIAS });
  r.puede = !r.duro && (!r.blandos.length || (p.forzar && String(p.motivoForzado || '').trim() !== ''));
  return r;
}

// --- Contadores -------------------------------------------------------------
function contarSemana(lunes) {
  const c = { rev730: 0, ny1530: 0, formacion: 0 };
  for (let i = 0; i < 7; i++) {
    const d = sumarDias(lunes, i), r = regDe(fechaISO(d));
    if (i <= 4) { if (r.rev730) c.rev730++; if (r.ny1530) c.ny1530++; }
    if (i === 1 || i === 3) { if (r.formacion) c.formacion++; }
  }
  return c;
}
function cumplimientoMes(ref) {
  let marcados = 0, si = 0;
  for (let d = new Date(ref.getFullYear(), ref.getMonth(), 1); d <= ref; d = sumarDias(d, 1)) {
    const r = regDe(fechaISO(d));
    if (r.reglas === 'sí' || r.reglas === 'no') { marcados++; if (r.reglas === 'sí') si++; }
  }
  return { marcados, si, pct: marcados ? Math.round(100 * si / marcados) : null };
}

      motivo: String(f.motivo || ''), aprendizaje: String(f.aprendizaje || ''),

function exportarJSON() {
  const out = { app: 'trading2627', version: 1, fecha: new Date().toISOString(), datos: {} };
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('trading2627:')) out.datos[k] = localStorage.getItem(k); } } catch (e) {}
  return JSON.stringify(out, null, 2);
}
function descargarCopia() {
  try {
    const blob = new Blob([exportarJSON()], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `trading-2627-copia-${fechaISO(new Date())}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    sync.msgCopia = { texto: 'Copia generada. Guárdala en Archivos, Drive o mándatela por correo.' };
  } catch (e) { sync.msgCopia = { texto: 'No se pudo generar la copia: ' + errorLegible(e), err: true }; }
  render();
}
function leerCopia(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o || o.app !== 'trading2627' || !o.datos || typeof o.datos !== 'object') throw new Error('el fichero no es una copia de Trading 26/27');
      sync.importPendiente = { datos: o.datos, n: Object.keys(o.datos).length, fecha: o.fecha ? new Date(o.fecha).toLocaleString('es-ES') : 'fecha desconocida' };
      sync.msgCopia = null;
    } catch (e) { sync.importPendiente = null; sync.msgCopia = { texto: 'Error: ' + errorLegible(e), err: true }; }
    render();
  };
  fr.onerror = () => { sync.msgCopia = { texto: 'No se pudo leer el fichero.', err: true }; render(); };
  fr.readAsText(file);
}
function aplicarImportacion() {
  const imp = sync.importPendiente; if (!imp) return;
  try {
    Object.keys(localStorage).filter((k) => k.startsWith('trading2627:')).forEach((k) => localStorage.removeItem(k));
    Object.entries(imp.datos).forEach(([k, v]) => { if (k.startsWith('trading2627:') && typeof v === 'string') localStorage.setItem(k, v); });
  } catch (e) { sync.importPendiente = null; sync.msgCopia = { texto: 'No se pudo restaurar: ' + errorLegible(e), err: true }; render(); return; }
  location.reload();
}

    <details><summary>Checklist de gestión</summary><ol class="pts">${CHECKLIST_GESTION.map((t) => `<li>${esc(t)}</li>`).join('')}</ol></details>
    <details><summary>Reglas de riesgo</summary><ul class="plain small">${REGLAS_RIESGO.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></details>
    <details><summary>Estrategia swing "HeatMap + Pivots"</summary>
      <p class="small"><b>Universo.</b> ${esc(ESTRATEGIA.universo)}</p>
      <p class="small"><b>Temporalidad.</b> ${esc(ESTRATEGIA.temporalidad)}</p>
      <p class="small"><b>Duración.</b> ${esc(ESTRATEGIA.duracion)}</p>
      <p class="small"><b>Stop.</b> ${esc(ESTRATEGIA.stop)}</p>
      <p class="small"><b>Objetivos.</b> ${esc(ESTRATEGIA.objetivos)}</p></details>
    <details><summary>Lo que no se hace</summary><ol class="pts">${NO_SE_HACE.map((t) => `<li>${esc(t)}</li>`).join('')}</ol></details>
    <details><summary>Objetivos del curso</summary><ul class="plain small">${OBJETIVOS.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></details></div>`;
  return h;
}

// --- Pestaña Ajustes --------------------------------------------------------
function viewAjustes() {
  const a = state.ajustes, m = sync.msgAjustes, mc = sync.msgCopia, imp = sync.importPendiente;
  let h = `<div class="card"><h2>Hoja "Registro Trading 26-27"</h2>
    <p class="small muted">Sigue <b>apps-script/INSTALAR.md</b> del repositorio para crear el script. La URL y el token se guardan solo en este móvil, no en el código.</p>
    <div class="field"><label for="cfgUrl">URL del Apps Script (termina en /exec)</label>
      <input type="url" id="cfgUrl" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a.url)}" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label for="cfgToken">Token</label>
      <input type="text" id="cfgToken" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a.token)}" placeholder="El valor de la propiedad TOKEN del script"></div>
    <div class="row" style="margin-top:12px"><button class="btn" data-act="cfgProbar">Probar conexión</button>
      <button class="btn sec" data-act="recuperar">Recuperar de la hoja</button></div>
    ${m ? `<div class="msg ${m.err ? 'err' : ''}">${esc(m.texto)}</div>` : ''}
    <p class="small muted" style="margin-top:12px"><span id="colaInfo">${esc(textoCola())}</span>
      <button class="btn ghost" data-act="sync" style="min-height:32px;padding:4px 8px">Reintentar envío</button></p></div>`;
  h += `<div class="card"><h2>Fase actual de scalping</h2>
    <p class="small muted">Se escribe en la columna "Fase scalping" al marcar cada día.</p>
    <div class="field"><select id="cfgFase">${FASES.map((f) => `<option value="${f.n}" ${a.fase === f.n ? 'selected' : ''}>${esc(f.nombre)} · ${esc(f.cuando)}</option>`).join('')}</select></div>
    <p class="small">${esc(faseActual().tarea)}</p></div>`;
  h += `<div class="card"><h2>Cuentas de swing activas</h2>
    <p class="small muted">Vienen marcadas por defecto en cada operación nueva de swing. La de scalping va sola en las de scalping.</p>
    <div class="chips">${CUENTAS.filter((c) => c !== CUENTA_SCALPING).map((c) => `<button class="${a.cuentasSwing.includes(c) ? 'on' : ''}" data-act="ajCuenta" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`;
  h += `<div class="card"><h2>Checklist de scalping</h2>
    <p class="small muted">Textos provisionales de las cinco casillas de las operaciones de scalping (columnas C1-C5). Se escribirán con la estrategia.</p>
    ${a.checklistScalping.map((t, i) => campo('Condición ' + (i + 1), `<input type="text" data-scalp="${i}" value="${esc(t)}" autocomplete="off">`)).join('')}</div>`;
  h += `<div class="card"><h2>Copia de seguridad</h2>
    <p class="small muted">Incluye todo lo guardado en este móvil: días marcados, operaciones, candidatas, estado semanal, backtest, cola pendiente, URL y token.</p>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="exportar">Descargar copia de seguridad</button>
      <label class="btn sec" for="importFile">Restaurar copia</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>
    ${imp ? `<div class="confirm">Restaurar la copia del ${esc(imp.fecha)} (${imp.n} apartados). Se sustituirán los datos actuales de este móvil.
      <div class="row"><button class="btn" data-act="importOk">Sí, restaurar</button><button class="btn ghost" data-act="importNo">Cancelar</button></div></div>` : ''}
    ${mc ? `<div class="msg ${mc.err ? 'err' : ''}">${esc(mc.texto)}</div>` : ''}</div>`;
  h += `<div class="card"><details><summary>Instalar la app en el móvil</summary>
    <p class="small"><b>iPhone:</b> abre esta página en Safari, toca <b>Compartir</b> y elige <b>Añadir a pantalla de inicio</b>.</p>
    <p class="small"><b>Android:</b> en Chrome, menú ⋮ y <b>Instalar aplicación</b>.</p>
    <p class="small muted">Una vez instalada funciona sin conexión: lo que marques se queda en la cola y se envía cuando haya internet.</p></details></div>`;
  return h;
}

// --- Pintado ----------------------------------------------------------------
let vistaAnterior = '';
function render() {
  const d = hoy(), w = semanaCurso(d), p = state.pantalla;
  $('#pill').textContent = (w < 1 ? 'Pretemporada' : 'S' + w) + ' · fase ' + state.ajustes.fase;
  const clave = p ? 'p:' + p.tipo + ':' + (p.uid || (p.o || p.c || {}).uid) : state.tab;
  const prev = $('.pantalla'), scrollP = prev && clave === vistaAnterior ? prev.scrollTop : 0;
  document.body.classList.toggle('enpantalla', !!p);
  $('#view').innerHTML = p
    ? `<div class="pantalla"><div class="inner">${viewPantalla()}</div></div>`
    : { hoy: viewHoy, operaciones: viewOperaciones, candidatas: viewCandidatas, plan: viewPlan, ajustes: viewAjustes }[state.tab]();
  if (p) $('.pantalla').scrollTop = scrollP;
  $('#tabbar').innerHTML = TABS.map((t) => `<button class="${t.id === state.tab ? 'on' : ''}" data-tab="${t.id}" aria-label="${t.n}"><span class="ic">${t.ic}</span>${t.n}</button>`).join('');
  if (clave !== vistaAnterior && !p) window.scrollTo(0, 0);
  vistaAnterior = clave;
  guardar();
}
function cerrarPantalla() { state.pantalla = null; guardarPantalla(); render(); }

// El domingo, al marcar la planificación: candidatas de la semana pasada sin entrada.
function candidatasSinEntrada(iso) {
  const antes = fechaISO(sumarDias(parseISO(iso), -7));
  return state.candidatas.filter((c) => c.fecha === antes && !c.pasada && (c.estado === 'pendiente' || c.estado === 'siguiente semana' || !c.estado));
}
function pasarCandidatas() {
  const q = state.pasar; if (!q) return;
  q.uids.forEach((u) => {
    const c = state.candidatas.find((x) => x.uid === u); if (!c) return;
    c.estado = 'siguiente semana'; c.pasada = true; guardarCandidata(c);
    guardarCandidata({ uid: uid(), fecha: q.fecha, activo: c.activo, direccion: c.direccion, zona: c.zona, stop: c.stop, tp1: c.tp1, estado: 'pendiente', notas: c.notas || '' });
  });
  state.pasar = null;
}

// --- Eventos ----------------------------------------------------------------
$('#tabbar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab; render();
});

$('#view').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.dataset.tab) { state.tab = el.dataset.tab; render(); return; }
  const iso = fechaISO(fechaTab()), reg = regDe(iso), v = el.dataset.v, p = state.pantalla;
  switch (el.dataset.act) {
    // Hoy
    case 'dia': state.offset = Math.min(0, Math.max(-DIAS_ATRAS, state.offset + parseInt(el.dataset.d, 10))); render(); break;
    case 'diaHoy': state.offset = 0; render(); break;
    case 'marcar': {
      const k = el.dataset.key, f = el.dataset.fecha, nuevo = !regDe(f)[k];
      guardarRegistro(f, { [k]: nuevo });
      if (k === 'planificacion' && nuevo) { const cs = candidatasSinEntrada(f); state.pasar = cs.length ? { fecha: f, uids: cs.map((c) => c.uid) } : null; }
      if (k === 'planificacion' && !nuevo) state.pasar = null;
      render(); encolarDia(f, { [k]: nuevo }); break;
    }
    case 'pasarSi': pasarCandidatas(); render(); break;
    case 'pasarNo': state.pasar = null; render(); break;
    case 'reglas': {
      const nuevo = reg.reglas === v ? '' : v;
      guardarRegistro(iso, { reglas: nuevo }); render();
      encolarDia(iso, { reglas: nuevo, reglaIncumplida: nuevo === 'no' ? (reg.reglaIncumplida || '') : '' }); break;
    }
    case 'freno': {
      const nuevo = reg.freno === v ? '' : v;
      guardarRegistro(iso, { freno: nuevo }); render(); encolarDia(iso, { freno: nuevo }); break;
    }
    // Operaciones
    case 'nuevaOp': abrirNuevaOp(); break;
    case 'editarOp': {
      const o = opDe(el.dataset.uid); if (!o) break;
      state.pantalla = { tipo: 'op', o: JSON.parse(JSON.stringify(o)), riesgoAuto: false, forzar: false, motivoForzado: '', activoOtro: !ACTIVOS.includes(o.activo) };
      guardarPantalla(); render(); break;
    }
    case 'gestionar': state.pantalla = { tipo: 'gestion', uid: el.dataset.uid, fecha: fechaISO(hoy()), accion: 'cierre parcial', pct: '', motivo: '', nota: '' }; guardarPantalla(); render(); break;
    case 'cerrar': {
      const o = opDe(el.dataset.uid); if (!o) break;
      state.pantalla = { tipo: 'cierre', uid: o.uid, fechaCierre: fechaISO(hoy()), salida: '', resultadoR: '', rManual: false,
        dentroReglas: o.dentroReglas || '', motivo: o.motivo || '', aprendizaje: o.aprendizaje || '' };
      guardarPantalla(); render(); break;
    }
    // Pantalla: operación
    case 'pCancelar': cerrarPantalla(); break;
    case 'pTipo':
      p.o.tipo = v; p.o.cuentas = v === 'scalping' ? [CUENTA_SCALPING] : state.ajustes.cuentasSwing.slice();
      recalcularRiesgo(p); guardarPantalla(); render(); break;
    case 'pDir': p.o.direccion = v; guardarPantalla(); render(); break;
    case 'pCuenta': {
      const cs = p.o.cuentas || [];
      p.o.cuentas = cs.includes(v) ? cs.filter((x) => x !== v) : CUENTAS.filter((c) => c === v || cs.includes(c));
      recalcularRiesgo(p); guardarPantalla(); render(); break;
    }
    case 'pCheck': { const id = el.dataset.id; p.o[id] = !p.o[id]; guardarPantalla(); render(); break; }
    case 'peReglas': p.o.dentroReglas = p.o.dentroReglas === v ? '' : v; guardarPantalla(); render(); break;
    case 'pGuardar': {
      const val = validarOp(p); if (!val.puede) { pintarPantalla(); break; }
      const o = p.o, nueva = !opDe(o.uid);
      o.activo = String(o.activo).trim().toUpperCase();
      if (nueva && val.blandos.length) {
        o.dentroReglas = 'no';
        o.motivo = 'Apertura: ' + val.blandos.join('; ') + ' — ' + String(p.motivoForzado).trim();
      }
      guardarOperacion(o);
      if (p.candUid) { const c = state.candidatas.find((x) => x.uid === p.candUid); if (c) { c.estado = 'entrada'; guardarCandidata(c); } }
      state.tab = 'operaciones'; cerrarPantalla(); break;
    }
    // Pantalla: gestión
    case 'gAccion': p.accion = v; guardarPantalla(); render(); break;
    case 'gMotivo': p.motivo = p.motivo === v ? '' : v; guardarPantalla(); render(); break;
    case 'gGuardar': {
      const o = opDe(p.uid); if (!o || !gestionValida(p)) break;
      o.gestion = (String(o.gestion || '').trim() ? String(o.gestion).trim() + '\n' : '') + lineaGestion(p);
      if (p.accion === 'break even') o.be = true;
      guardarOperacion(o, ['gestion']); cerrarPantalla(); break;
    }
    // Pantalla: cierre
    case 'cReglas': p.dentroReglas = p.dentroReglas === v ? '' : v; guardarPantalla(); render(); break;
    case 'cGuardar': {
      const o = opDe(p.uid); if (!o || !cierreValido(p)) break;
      const campos = ['fechaCierre', 'resultadoR', 'dentroReglas', 'motivo', 'aprendizaje'];
      if (num(p.salida) !== '') { o.gestion = (String(o.gestion || '').trim() ? String(o.gestion).trim() + '\n' : '') + `${p.fechaCierre}: cierre a ${p.salida}`; campos.push('gestion'); }
      Object.assign(o, { fechaCierre: p.fechaCierre, resultadoR: p.resultadoR, dentroReglas: p.dentroReglas,
        motivo: p.dentroReglas === 'no' ? String(p.motivo).trim() : (o.motivo || ''), aprendizaje: p.aprendizaje });
      guardarOperacion(o, campos); cerrarPantalla(); break;
    }
    // Candidatas
    case 'sem': state.semanaSel = Math.min(ULTIMA_SEMANA, Math.max(1, semanaSel() + parseInt(el.dataset.d, 10))); render(); break;
    case 'semHoy': state.semanaSel = null; render(); break;
    case 'nuevaCand':
      state.pantalla = { tipo: 'cand', c: { uid: uid(), fecha: fechaISO(domingoDeSemana(semanaSel())), activo: '', direccion: 'largo', zona: '', stop: '', tp1: '', estado: 'pendiente', notas: '' }, activoOtro: false };
      guardarPantalla(); render(); break;
    case 'editarCand': {
      const c = state.candidatas.find((x) => x.uid === el.dataset.uid); if (!c) break;
      state.pantalla = { tipo: 'cand', c: JSON.parse(JSON.stringify(c)), activoOtro: !ACTIVOS.includes(c.activo) }; guardarPantalla(); render(); break;
    }
    case 'candEstado': { const c = state.candidatas.find((x) => x.uid === el.dataset.uid); if (c) { c.estado = v; guardarCandidata(c); render(); } break; }
    case 'convertir': {
      const c = state.candidatas.find((x) => x.uid === el.dataset.uid); if (!c) break;
      abrirNuevaOp({ activo: c.activo, direccion: c.direccion || 'largo', entrada: c.zona, stop: c.stop, tp1: c.tp1 }, c.uid); break;
    }
    case 'pcDir': p.c.direccion = v; guardarPantalla(); render(); break;
    case 'pcEstado': p.c.estado = v; guardarPantalla(); render(); break;
    case 'pcGuardar': {
      if (!String(p.c.activo || '').trim()) break;
      p.c.activo = String(p.c.activo).trim().toUpperCase(); guardarCandidata(p.c); cerrarPantalla(); break;
    }
    case 'addEst': {
      guardarEstadoSemanal(Object.assign({ uid: uid(), fecha: fechaISO(domingoDeSemana(semanaSel())) }, borradores.est));
      borradores.est = null; render(); break;
    }
    case 'traerCuentas': probarConexion(); break;
    // Plan
    case 'btEstr': borradores.bt.estrategia = v; render(); break;
    case 'btCheck': borradores.bt.checklist = v; render(); break;
    case 'addBt': {
      const b = borradores.bt;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(b.fecha || '')) break;
      guardarBacktest(Object.assign({ uid: uid() }, b)); borradores.bt = null; render(); break;
    }
    // Ajustes y sincronización
    case 'ajCuenta': {
      const cs = state.ajustes.cuentasSwing;
      state.ajustes.cuentasSwing = cs.includes(v) ? cs.filter((x) => x !== v) : CUENTAS.filter((c) => c === v || cs.includes(c));
      LS.set('ajustes', state.ajustes); render(); break;
    }
    case 'sync': if (!configurado()) { state.tab = 'ajustes'; render(); } else { if (!state.cola.length) sync.error = ''; sincronizar(); } break;
    case 'cfgProbar': probarConexion(); break;
    case 'recuperar': recuperarDeLaHoja(); break;
    case 'exportar': descargarCopia(); break;
    case 'importOk': aplicarImportacion(); break;
    case 'importNo': sync.importPendiente = null; render(); break;
  }
});

// Escribir en un campo no repinta la vista: solo actualiza el estado y las partes vivas.
function alEscribir(t) {
  const o = t.dataset.o, f = t.dataset.f, p = state.pantalla;
  if (o && f) {
    if (p && (o === 'po' || o === 'pc' || o === 'p')) {
      const obj = o === 'po' ? p.o : o === 'pc' ? p.c : p;
      obj[f] = t.value;
      if (o === 'po' && f === 'riesgo') p.riesgoAuto = false;
      if (o === 'po' && (f === 'fechaApertura')) recalcularRiesgo(p);
      if (p.tipo === 'cierre' && f === 'salida' && !p.rManual) {
        const op = opDe(p.uid), rs = op ? rDeSalida(op, p.salida) : null;
        p.resultadoR = rs == null ? '' : fmtRiesgo(Math.round(rs * 100) / 100);
        const campoR = $('#cR'); if (campoR) campoR.value = p.resultadoR;
      }
      if (p.tipo === 'cierre' && f === 'resultadoR') p.rManual = t.value.trim() !== '';
      guardarPantalla(); pintarPantalla();
    } else if (o === 'reg') {
      guardarRegistro(fechaISO(fechaTab()), { [f]: t.value });
    } else if (borradores[o]) {
      borradores[o][f] = t.value;
    }
    return true;
  }
  if (t.dataset.scalp != null) {
    state.ajustes.checklistScalping[+t.dataset.scalp] = t.value; LS.set('ajustes', state.ajustes); return true;
  }
  if (t.id === 'cfgUrl' || t.id === 'cfgToken') {
    state.ajustes[t.id === 'cfgUrl' ? 'url' : 'token'] = t.value.trim(); LS.set('ajustes', state.ajustes); pintarSync(); return true;
  }
  return false;
}
$('#view').addEventListener('input', (e) => { alEscribir(e.target); });
$('#view').addEventListener('change', (e) => {
  const t = e.target, p = state.pantalla;
  if (t.dataset.activo && p) {
    const obj = t.dataset.activo === 'po' ? p.o : p.c;
    p.activoOtro = t.value === 'otro'; obj.activo = t.value === 'otro' ? '' : t.value;
    guardarPantalla(); render();
    if (p.activoOtro) { const x = $(`input[data-o="${t.dataset.activo}"][data-f="activo"]`); if (x) x.focus(); }
    return;
  }
  if (t.id === 'pForzar' && p) { p.forzar = t.checked; guardarPantalla(); pintarPantalla(); return; }
  if (t.id === 'cfgFase') { state.ajustes.fase = parseInt(t.value, 10) || 0; LS.set('ajustes', state.ajustes); render(); return; }
  if (t.id === 'importFile') { leerCopia(t.files && t.files[0]); t.value = ''; return; }
  if (t.id === 'cfgUrl' || t.id === 'cfgToken') { sync.error = ''; sync.msgAjustes = null; sincronizar(); return; }
  alEscribir(t);
  if (t.dataset.o === 'reg') encolarDia(fechaISO(fechaTab()), { [t.dataset.f]: t.value });
  if (t.dataset.o === 'po' && t.dataset.f === 'fechaApertura') render();   // el aviso de viernes depende de la fecha
});
$('#view').addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.k) abiertosDet[d.dataset.k] = d.open; }, true);
$('#view').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input[data-o="reg"]')) { e.preventDefault(); e.target.blur(); }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!state.pantalla) render(); sincronizar(); } });
window.addEventListener('online', () => sincronizar());

render();
sincronizar();

// --- PWA: service worker (solo bajo http/https, no con file://) -------------
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>

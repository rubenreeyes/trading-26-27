<script>
/* =====================================================================

const FORMACION = {

       detalle: 'Primer trimestre: revisar las últimas 30-50 operaciones con la checklist (cumplía sí/no, resultado en R). Una sesión al mes de errores del diario; el resto, lectura de proceso ("The Playbook", "Trading in the Zone").' },

};

  puntos: [
    'Estado de cuentas.',
    'Revisión de la semana con el diario.',
    'Calendario económico.',
    'Recorrer la lista fija y la cartera de largo plazo buscando fin de ciclo y nueva zona repetida.',

// Checklist de entrada: las cinco a la vez (columnas L-P de Operaciones).
const CHECKLIST_ENTRADA = [
  { id: 'c1', corto: 'Fin de ciclo',
    texto: 'El precio ha completado, o está a punto de completar, la última zona roja de la tendencia bajista y no queda ninguna más cerca en esa dirección (espejo para cortos).' },
  { id: 'c2', corto: 'Nueva zona objetivo',
    texto: 'Hay una zona HeatMap repetida en 3 o más temporalidades en la dirección de la nueva tendencia, con recorrido alcanzable esta semana.' },
  { id: 'c3', corto: 'Gatillo',
    texto: 'Fin de ciclo confirmado o rotura que ya inicia la otra tendencia, con retroceso apoyado en un pivot (típico: giro alcista y retroceso a S61).' },
  { id: 'c4', corto: 'Contexto',
    texto: 'Tendencia de fondo, resistencias fuertes y roturas de línea de tendencia no contradicen la operación.' },
  { id: 'c5', corto: 'Ratio ≥ 1:3',
    texto: 'Al menos 1:3 hasta TP1.' }
];

const CHECKLIST_GESTION = [
  'Movimiento brusco a favor: cerrar parcial (o todo si ya está en TP1).',
  'Break even en operaciones grandes (1:5 o más) cuando va por 1:3.',
  'Noticia de alto impacto pendiente: stop más alejado, break even o cerrar parciales muy positivos.',
  'Cierre por calendario: día de retiro o cuenta en su objetivo.',
  'Viernes 15:30: revisar exposición de fin de semana.'
];

const REGLAS_RIESGO = [
  '1 % por operación con una o dos posiciones abiertas; 0,75 % a partir de la tercera. En challenge, 1 % siempre y máximo tres posiciones.',
  'Riesgo abierto máximo por cuenta 2,25 % (3 % en challenge). Nunca cuatro posiciones. Una posición en break even deja de contar.',
  'El riesgo en dinero es siempre el mismo: el tamaño se adapta al stop, nunca al revés.',

const NO_SE_HACE = [

const ESTRATEGIA = {
  universo: 'XAUUSD, BTCUSD, TSLA, NVDA y META como lista fija; ampliable a acciones de la cartera de largo plazo que cumplan la checklist entera.',
  temporalidad: 'Análisis de diario a 1H; entrada y gestión en 1H. Por debajo de 1H solo para afinar un cierre, nunca para abrir.',

  objetivos: 'TP1, TP2… son las siguientes zonas HeatMap. Sin TP fijo: se gestiona.'
};

const FRENOS = {
  diario:  'Freno diario activo: no se abre nada nuevo hasta mañana. Lo abierto se gestiona con normalidad.',
  semanal: 'Freno semanal activo: solo se gestiona lo abierto. El domingo se revisa qué ha pasado antes de volver a abrir.'
};

const CUENTAS = ['50K-A', '50K-B', '200K', '100K', 'Propia', 'Scalping'];
const ACTIVOS = ['XAUUSD', 'BTCUSD', 'TSLA', 'NVDA', 'META'];
const ESTADOS_CANDIDATA = ['pendiente', 'entrada', 'descartada', 'siguiente semana'];

const OBJETIVOS = [
  'Aprobar la cuenta de 200K antes del 15-10-2026 y la de 100K antes del 15-12-2026. Si una fecha no llega, se aplaza; nunca se sube el tamaño.',
  '100 % de operaciones dentro de la checklist y las reglas de riesgo.',
  'Revisión de 7:30 y sesión de 15:30 al menos 4 de 5 días; planificación cada domingo.',
  'Formación: martes swing y proceso, jueves scalping, 1,5 h cada uno.'
];

/* =====================================================================
   INTERFAZ · a partir de aquí no hace falta tocar nada para cambiar datos
   ===================================================================== */

// --- Utilidades ------------------------------------------------------------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// localStorage siempre entre try/catch: en modo privado o sin permiso puede fallar.
const LS = {
  get(k, def) { try { const v = localStorage.getItem('trading2627:' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('trading2627:' + k, JSON.stringify(v)); } catch (e) { /* sin persistencia */ } },
};

// Números escritos con coma o con punto. '' cuando no hay nada que escribir.
function num(v) { const s = String(v == null ? '' : v).replace(',', '.').trim(); if (s === '') return ''; const n = parseFloat(s); return isNaN(n) ? '' : n; }
function fmt(n, d) { return Number(n).toFixed(d == null ? 2 : d).replace('.', ','); }

// --- Fechas ----------------------------------------------------------------
// Para previsualizar otro día abre la app con ?fecha=2026-10-15
const FECHA_FORZADA = (() => { try { return new URLSearchParams(location.search).get('fecha'); } catch (e) { return null; } })();
function parseISO(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function fechaISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hoy() { if (FECHA_FORZADA && /^\d{4}-\d{2}-\d{2}$/.test(FECHA_FORZADA)) return parseISO(FECHA_FORZADA); const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function sumarDias(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function diaSemana(d) { return (d.getDay() + 6) % 7; }                       // 0 = lunes … 6 = domingo
function semanaCurso(d) { return Math.floor(Math.round((d - parseISO(CURSO_INICIO)) / 86400000) / 7) + 1; }
function enCurso(d) { return d >= parseISO(CURSO_INICIO) && d <= parseISO(CURSO_FIN); }
function lunesDe(d) { return sumarDias(d, -diaSemana(d)); }
function fechaLarga(d) { return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fechaCorta(d) { return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); }
const ULTIMA_SEMANA = Math.max(1, semanaCurso(parseISO(CURSO_FIN)));
// El domingo planifica la semana siguiente; el resto de días, la semana en curso.
function semanaPlan(d) { return Math.max(1, Math.min(ULTIMA_SEMANA, diaSemana(d) === 6 ? semanaCurso(d) + 1 : semanaCurso(d))); }
function domingoDeSemana(w) { return sumarDias(parseISO(CURSO_INICIO), 7 * (w - 1) - 1); }   // domingo previo al lunes de esa semana

// --- Estado ----------------------------------------------------------------
const TABS = [
  { id: 'hoy', n: 'Hoy', ic: '📅' }, { id: 'diario', n: 'Diario', ic: '📈' },
  { id: 'semana', n: 'Semana', ic: '🗓️' }, { id: 'plan', n: 'Plan', ic: '📋' },
  { id: 'ajustes', n: 'Ajustes', ic: '⚙️' },
];
const state = {
  tab: LS.get('tab', 'hoy'),
  offset: 0,                                  // 0 = hoy, -1 = ayer, -2 = anteayer

// --- Cola de sincronización -------------------------------------------------
function configurado() { return !!(state.ajustes.url && state.ajustes.token); }
const sync = { enCurso: false, error: '', ultima: LS.get('syncUltima', null), msgAjustes: null, msgCopia: null, importPendiente: null };

// Un elemento por registro (k). Los cambios del mismo registro se fusionan.
function encolar(k, accion, datos, ref) {
  const i = state.cola.findIndex((c) => c.k === k);
  if (i >= 0) Object.assign(state.cola[i].datos, datos);
  else state.cola.push({ k, accion, datos: Object.assign({}, datos), ref: ref || null });
  LS.set('cola', state.cola); pintarSync(); sincronizar();
}
function encolarDia(iso, cambios) {
  if (!enCurso(parseISO(iso))) { pintarSync(); return; }     // fuera del curso no hay fila en la hoja
  encolar('dia:' + iso, 'dia', Object.assign({ fecha: iso, fase: state.ajustes.fase }, cambios));
}
function errorLegible(e) {
  const m = (e && e.message) || String(e);
  if (/Failed to fetch|NetworkError|Load failed|network|fetch/i.test(m)) return 'sin conexión o URL incorrecta';
  return m;
}
// POST con text/plain (evita el preflight de CORS con Apps Script) y redirect: 'follow'.
async function llamarScript(metodo, cuerpo) {
  const { url, token } = state.ajustes;
  let res;
  if (metodo === 'GET') {
    const q = new URLSearchParams(Object.assign({ token }, cuerpo)).toString();
    res = await fetch(url + (url.includes('?') ? '&' : '?') + q, { method: 'GET', redirect: 'follow' });
  } else {
    res = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ token }, cuerpo)) });
  }
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('la URL no responde JSON (¿es la que termina en /exec?)'); }
  if (!j.ok) { const err = new Error(j.error || 'error del script'); err.codigo = j.codigo; throw err; }
  return j;
}
// Antes de enviar se completan las claves que la hoja ya conoce (id de operación, fila de candidata).
function prepararEnvio(item) {
  if (item.accion === 'operacion' && item.ref) {
    const op = state.operaciones.find((o) => o.uid === item.ref);
    if (op && op.id != null) item.datos.id = op.id;
  }
  if (item.accion === 'candidata' && item.ref) {
    const c = state.candidatas.find((x) => x.uid === item.ref);
    if (c && c.fila != null) item.datos.fila = c.fila;
  }
  return item.datos;
}
async function sincronizar() {
  if (sync.enCurso || !configurado() || !state.cola.length) { pintarSync(); return; }
  sync.enCurso = true; pintarSync();
  try {
    while (state.cola.length) {
      const item = state.cola[0];
      let j;
      try { j = await llamarScript('POST', { accion: item.accion, datos: prepararEnvio(item) }); }
      catch (e) {
        // Lo que la hoja nunca podrá aceptar se descarta para no bloquear la cola.
        if (/fecha no encontrada|fecha inválida|acción desconocida|id fuera|id inválido/i.test(e.message || '')) {
          state.cola.shift(); LS.set('cola', state.cola); sync.error = `${item.k}: ${e.message}`; continue;
        }
        throw e;
      }
      if (item.accion === 'operacion' && item.ref && j.id != null) {
        const op = state.operaciones.find((o) => o.uid === item.ref);
        if (op && op.id == null) { op.id = j.id; LS.set('operaciones', state.operaciones); }
      }
      if (item.accion === 'candidata' && item.ref && j.fila != null) {
        const c = state.candidatas.find((x) => x.uid === item.ref);
        if (c && c.fila == null) { c.fila = j.fila; LS.set('candidatas', state.candidatas); }
      }
      state.cola.shift(); LS.set('cola', state.cola); sync.error = '';
    }
    sync.ultima = Date.now(); LS.set('syncUltima', sync.ultima);
  } catch (e) { sync.error = errorLegible(e); }
  sync.enCurso = false; pintarSync();
}
function estadoSync() {
  const n = state.cola.length, pend = n ? ` · ${n} pendiente${n > 1 ? 's' : ''}` : '';
  if (!configurado()) return ['idle', 'Sin configurar' + pend, 'toca para ir a Ajustes'];
  if (sync.enCurso) return ['pend', 'Enviando…', ''];
  if (sync.error) return ['err', 'Error: ' + sync.error + pend, 'toca para reintentar'];
  if (n) return ['pend', `${n} pendiente${n > 1 ? 's' : ''}`, 'toca para reintentar'];
  const h = sync.ultima ? new Date(sync.ultima).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '';
  return ['ok', 'Sincronizado' + (h ? ' · ' + h : ''), ''];
}
function syncHTML() {

// --- Contadores -------------------------------------------------------------
function contarSemana(lunes) {
  const c = { rev730: 0, ny1530: 0, formacion: 0 };
  for (let i = 0; i < 7; i++) {
    const d = sumarDias(lunes, i), r = regDe(fechaISO(d));
    if (i <= 4) { if (r.rev730) c.rev730++; if (r.ny1530) c.ny1530++; }
    if (i === 1 || i === 3) { if (r.formacion) c.formacion++; }
  }
  return c;
}
function cumplimientoMes(ref) {
  let marcados = 0, si = 0;
  for (let d = new Date(ref.getFullYear(), ref.getMonth(), 1); d <= ref; d = sumarDias(d, 1)) {
    const r = regDe(fechaISO(d));
    if (r.reglas === 'sí' || r.reglas === 'no') { marcados++; if (r.reglas === 'sí') si++; }
  }
  return { marcados, si, pct: marcados ? Math.round(100 * si / marcados) : null };
}

        planificacion: !!f.planificacion, reglas: String(f.reglas || ''), reglaIncumplida: String(f.reglaIncumplida || ''),
        freno: String(f.freno || ''), notas: String(f.notas || '') });
    });

      activo: String(f.activo || ''), direccion: String(f.direccion || ''),

      fechaCierre: f.fechaCierre || '', resultadoR: f.resultadoR, dentroReglas: String(f.dentroReglas || ''),
      motivo: String(f.motivo || ''), aprendizaje: String(f.aprendizaje || '')

    LS.set('operaciones', state.operaciones);

function exportarJSON() {

  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('trading2627:')) out.datos[k] = localStorage.getItem(k); } } catch (e) {}
  return JSON.stringify(out, null, 2);
}
function descargarCopia() {
  try {
    const blob = new Blob([exportarJSON()], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `trading-2627-copia-${fechaISO(new Date())}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    sync.msgCopia = { texto: 'Copia generada. Guárdala en Archivos, Drive o mándatela por correo.' };

function leerCopia(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o || o.app !== 'trading2627' || !o.datos || typeof o.datos !== 'object') throw new Error('el fichero no es una copia de Trading 26/27');
      sync.importPendiente = { datos: o.datos, n: Object.keys(o.datos).length, fecha: o.fecha ? new Date(o.fecha).toLocaleString('es-ES') : 'fecha desconocida' };
      sync.msgCopia = null;
    } catch (e) { sync.importPendiente = null; sync.msgCopia = { texto: 'Error: ' + errorLegible(e), err: true }; }
    render();
  };
  fr.onerror = () => { sync.msgCopia = { texto: 'No se pudo leer el fichero.', err: true }; render(); };
  fr.readAsText(file);
}
function aplicarImportacion() {
  const imp = sync.importPendiente; if (!imp) return;
  try {
    Object.keys(localStorage).filter((k) => k.startsWith('trading2627:')).forEach((k) => localStorage.removeItem(k));
    Object.entries(imp.datos).forEach(([k, v]) => { if (k.startsWith('trading2627:') && typeof v === 'string') localStorage.setItem(k, v); });
  } catch (e) { sync.importPendiente = null; sync.msgCopia = { texto: 'No se pudo restaurar: ' + errorLegible(e), err: true }; render(); return; }
  location.reload();
}

function resumenBacktest() {
  const xs = state.backtest, rs = xs.map((x) => num(x.resultadoR)).filter((v) => v !== '');
  const total = rs.reduce((a, b) => a + b, 0);
  let racha = 0, peor = 0;
  xs.slice().reverse().forEach((x) => { const r = num(x.resultadoR); if (r !== '' && r < 0) { racha++; peor = Math.max(peor, racha); } else if (r !== '') racha = 0; });
  const ok = xs.filter((x) => x.checklist === 'sí').length;
  return { n: xs.length, total, media: rs.length ? total / rs.length : null, peor, ok };
}

      <div class="row"><button class="btn" data-act="importOk">Sí, restaurar</button><button class="btn ghost" data-act="importNo">Cancelar</button></div></div>` : ''}
    ${mc ? `<div class="msg ${mc.err ? 'err' : ''}">${esc(mc.texto)}</div>` : ''}</div>`;
  h += `<div class="card"><details><summary>Instalar la app en el móvil</summary>
    <p class="small"><b>iPhone:</b> abre esta página en Safari, toca <b>Compartir</b> y elige <b>Añadir a pantalla de inicio</b>.</p>
    <p class="small"><b>Android:</b> en Chrome, menú ⋮ y <b>Instalar aplicación</b>.</p>
    <p class="small muted">Una vez instalada funciona sin conexión: lo que marques se queda en la cola y se envía cuando haya internet.</p></details></div>`;
  return h;
}

// --- Pintado ----------------------------------------------------------------
let vistaAnterior = '';
function render() {
  const d = hoy(), w = semanaCurso(d);
  $('#pill').textContent = (w < 1 ? 'Pretemporada' : 'S' + w) + ' · fase ' + state.ajustes.fase;
  $('#view').innerHTML = { hoy: viewHoy, diario: viewDiario, semana: viewSemana, plan: viewPlan, ajustes: viewAjustes }[state.tab]();
  $('#tabbar').innerHTML = TABS.map((t) => `<button class="${t.id === state.tab ? 'on' : ''}" data-tab="${t.id}" aria-label="${t.n}"><span class="ic">${t.ic}</span>${t.n}</button>`).join('');
  const clave = state.tab + ':' + (state.form ? state.form.uid : '');
  if (clave !== vistaAnterior) window.scrollTo(0, 0);
  vistaAnterior = clave;
  guardar();
}
function guardarForm() { LS.set('form', state.form); }

// --- Eventos ----------------------------------------------------------------
$('#tabbar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (b.dataset.tab === 'diario' && state.tab === 'diario') { state.form = null; guardarForm(); }
  state.tab = b.dataset.tab; state.borrar = null; render();
});

$('#view').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.dataset.tab) { state.tab = el.dataset.tab; render(); return; }
  const iso = fechaISO(fechaTab()), reg = regDe(iso), v = el.dataset.v;
  switch (el.dataset.act) {
    // Hoy
    case 'dia': state.offset = Math.min(0, Math.max(-DIAS_ATRAS, state.offset + parseInt(el.dataset.d, 10))); render(); break;
    case 'diaHoy': state.offset = 0; render(); break;
    case 'marcar': {
      const k = el.dataset.key, f = el.dataset.fecha, nuevo = !regDe(f)[k];
      guardarRegistro(f, { [k]: nuevo }); render(); encolarDia(f, { [k]: nuevo }); break;
    }
    case 'reglas': {
      const nuevo = reg.reglas === v ? '' : v;
      guardarRegistro(iso, { reglas: nuevo }); render();
      encolarDia(iso, { reglas: nuevo, reglaIncumplida: nuevo === 'no' ? (reg.reglaIncumplida || '') : '' }); break;
    }
    case 'freno': {
      const nuevo = reg.freno === v ? '' : v;
      guardarRegistro(iso, { freno: nuevo }); render(); encolarDia(iso, { freno: nuevo }); break;
    }
    // Diario
    case 'nuevaOp': state.form = opNueva(iso); guardarForm(); state.tab = 'diario'; render(); break;
    case 'abrirOp': {
      const o = state.operaciones.find((x) => x.uid === el.dataset.uid);
      if (o) { state.form = JSON.parse(JSON.stringify(o)); guardarForm(); render(); } break;
    }
    case 'cerrarOp': state.form = null; state.borrar = null; guardarForm(); render(); break;
    case 'opTipo': state.form.tipo = v; guardarForm(); render(); break;
    case 'opDir': state.form.direccion = v; guardarForm(); render(); break;
    case 'opReglas': state.form.dentroReglas = state.form.dentroReglas === v ? '' : v; guardarForm(); render(); break;
    case 'opCheck': { const id = el.dataset.id; state.form[id] = !state.form[id]; guardarForm(); render(); break; }
    case 'opCuenta': {
      const cs = state.form.cuentas || [];
      state.form.cuentas = cs.includes(v) ? cs.filter((x) => x !== v) : cs.concat([v]);
      guardarForm(); render(); break;
    }
    case 'opLinea': {
      const g = state.form.gestion || '';
      state.form.gestion = (g && !g.endsWith('\n') ? g + '\n' : g) + fechaISO(hoy()) + ': ';
      guardarForm(); render();
      const t = $('textarea[data-f="gestion"]'); if (t) { t.focus(); t.selectionStart = t.selectionEnd = t.value.length; }
      break;
    }
    case 'guardarOp': {
      const o = state.form;
      if (!String(o.activo || '').trim()) { alert('Falta el activo.'); break; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(o.fechaApertura || '')) { alert('Falta la fecha de apertura.'); break; }
      o.activo = o.activo.trim();
      guardarOperacion(JSON.parse(JSON.stringify(o)));
      state.form = null; state.borrar = null; guardarForm(); render(); break;
    }
    case 'opQuitar': state.borrar = state.form.uid; render(); break;
    case 'opQuitarNo': state.borrar = null; render(); break;
    case 'opQuitarOk': {
      const u = state.form.uid;
      state.operaciones = state.operaciones.filter((x) => x.uid !== u); LS.set('operaciones', state.operaciones);
      state.cola = state.cola.filter((c) => c.k !== 'op:' + u); LS.set('cola', state.cola);
      state.form = null; state.borrar = null; guardarForm(); render(); break;
    }
    // Semana
    case 'sem': state.semanaSel = Math.min(ULTIMA_SEMANA, Math.max(1, semanaSel() + parseInt(el.dataset.d, 10))); render(); break;
    case 'semHoy': state.semanaSel = null; render(); break;
    case 'candDir': borradores.cand.direccion = v; render(); break;
    case 'addCand': {
      const b = borradores.cand;
      if (!String(b.activo || '').trim()) { alert('Falta el activo.'); break; }
      guardarCandidata(Object.assign({ uid: uid(), fecha: fechaISO(domingoDeSemana(semanaSel())) }, b, { activo: b.activo.trim() }));
      borradores.cand = null; render(); break;
    }
    case 'candEstado': {
      const c = state.candidatas.find((x) => x.uid === el.dataset.uid);
      if (c) { c.estado = v; guardarCandidata(c); render(); } break;
    }
    case 'addEst': {
      const b = borradores.est;
      guardarEstadoSemanal(Object.assign({ uid: uid(), fecha: fechaISO(domingoDeSemana(semanaSel())) }, b));
      borradores.est = null; render(); break;
    }
    case 'traerCuentas': probarConexion(); break;
    // Plan
    case 'btEstr': borradores.bt.estrategia = v; render(); break;
    case 'btCheck': borradores.bt.checklist = v; render(); break;
    case 'addBt': {
      const b = borradores.bt;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(b.fecha || '')) { alert('Falta la fecha del caso.'); break; }
      guardarBacktest(Object.assign({ uid: uid() }, b));
      borradores.bt = null; render(); break;
    }
    // Ajustes y sincronización
    case 'sync': if (!configurado()) { state.tab = 'ajustes'; render(); } else { if (!state.cola.length) sync.error = ''; sincronizar(); } break;
    case 'cfgProbar': probarConexion(); break;
    case 'recuperar': recuperarDeLaHoja(); break;
    case 'exportar': descargarCopia(); break;
    case 'importOk': aplicarImportacion(); break;
    case 'importNo': sync.importPendiente = null; render(); break;
  }
});

// Escribir en un campo no repinta la vista: solo actualiza el estado y los ratios.
function alEscribir(t) {
  const o = t.dataset.o, f = t.dataset.f;
  if (o && f) {
    if (o === 'form' && state.form) {
      state.form[f] = t.value; guardarForm();
      const r = $('#ratioOp'); if (r) r.innerHTML = tagRatio(ratioDe(state.form));
    } else if (o === 'reg') {
      guardarRegistro(fechaISO(fechaTab()), { [f]: t.value });
    } else if (borradores[o]) {
      borradores[o][f] = t.value;
      const r = $('#ratioCand'); if (o === 'cand' && r) r.innerHTML = tagRatio(ratioCand(borradores.cand));
    }
    return true;
  }
  if (t.id === 'cfgUrl' || t.id === 'cfgToken') {
    state.ajustes[t.id === 'cfgUrl' ? 'url' : 'token'] = t.value.trim(); LS.set('ajustes', state.ajustes); pintarSync(); return true;
  }
  return false;
}
$('#view').addEventListener('input', (e) => { alEscribir(e.target); });
$('#view').addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'cfgFase') { state.ajustes.fase = parseInt(t.value, 10) || 0; LS.set('ajustes', state.ajustes); render(); return; }
  if (t.id === 'importFile') { leerCopia(t.files && t.files[0]); t.value = ''; return; }
  if (t.id === 'cfgUrl' || t.id === 'cfgToken') { sync.error = ''; sync.msgAjustes = null; sincronizar(); return; }
  alEscribir(t);
  // Al salir de un campo del día, el cambio se encola.
  if (t.dataset.o === 'reg') encolarDia(fechaISO(fechaTab()), { [t.dataset.f]: t.value });
});
$('#view').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input[data-o="reg"]')) { e.preventDefault(); e.target.blur(); }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); sincronizar(); } });
window.addEventListener('online', () => sincronizar());

render();
sincronizar();

// --- PWA: service worker (solo bajo http/https, no con file://) -------------
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>

<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --text:#141a24; --muted:#5c6980; --line:#dee3ec;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#dbe7fe;
  --ok:#15803d; --ok-soft:#dcfce7;
  --warn:#b45309; --warn-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2;
  --shadow:0 1px 2px rgba(0,0,0,.06); --radius:14px; --nav-h:64px;
  color-scheme: light;
}
/* Oscuro: automático con el sistema, salvo que el tema esté fijado a claro. */
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
  --bg:#0e1219; --card:#181e29; --text:#e7ecf5; --muted:#9aa7bd; --line:#2a3444;
  --accent:#60a5fa; --accent-ink:#0a1a33; --accent-soft:#1c2f4d;
  --ok:#4ade80; --ok-soft:#12351f;
  --warn:#fbbf24; --warn-soft:#3a2c0a; --danger:#f87171; --danger-soft:#431515;
  --shadow:none;
  color-scheme: dark;
  }
}
/* Oscuro fijado a mano en Ajustes. */
:root[data-tema="oscuro"]{
  --bg:#0e1219; --card:#181e29; --text:#e7ecf5; --muted:#9aa7bd; --line:#2a3444;
  --accent:#60a5fa; --accent-ink:#0a1a33; --accent-soft:#1c2f4d;
  --ok:#4ade80; --ok-soft:#12351f;
  --warn:#fbbf24; --warn-soft:#3a2c0a; --danger:#f87171; --danger-soft:#431515;
  --shadow:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);overflow-x:hidden}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;
  align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header.top h1{font-size:20px;margin:0}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--text);white-space:nowrap}
main{padding:12px 14px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card h3:first-child{margin-top:0}
.card p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:14px} .b{font-weight:700}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;min-height:44px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent}
.btn.sec{background:var(--accent-soft);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 10px;min-height:40px}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4}
nav.tabbar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--card);border-top:1px solid var(--line);z-index:10}
nav.tabbar button{flex:1;background:none;color:var(--muted);border-radius:0;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;min-height:0}
nav.tabbar button .ic{font-size:21px;line-height:1}
nav.tabbar button.on{color:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);vertical-align:middle;margin-left:6px;white-space:nowrap}
.tag.warn{background:var(--warn-soft)} .tag.bad{background:var(--danger-soft)} .tag.ok{background:var(--ok-soft)}
.tag.plain{background:var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{font:inherit;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);min-height:44px;width:100%}
textarea{min-height:88px;line-height:1.4;resize:vertical}
.field{margin-top:10px} .field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f2 .field,.f3 .field{margin-top:10px;min-width:0}
.msg{margin-top:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.msg.err{background:var(--danger-soft)} .msg.ok{background:var(--ok-soft)}
.notice{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.confirm{background:var(--warn-soft);border-radius:12px;padding:12px;margin-top:10px}
.confirm .row{margin-top:8px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
details[open] summary{margin-bottom:4px}
ul.plain{margin:6px 0;padding-left:20px} ul.plain li{margin:4px 0}
ol.plain{margin:6px 0;padding-left:22px} ol.plain li{margin:4px 0}
.datebar{display:flex;align-items:center;gap:8px}
.datebar .btn{padding:6px 12px;min-height:38px;flex:none}
.datebar .d{flex:1;min-width:0}
.hoy-big{font-size:19px;font-weight:700;margin:2px 0}
.hoy-sub{color:var(--muted)}
button.sync{background:none;color:var(--muted);padding:8px 0 0;min-height:0;border-radius:0;font-weight:500;justify-content:flex-start;font-size:13px;width:100%;text-align:left;gap:8px;flex-wrap:wrap}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .dot{background:var(--ok)} .sync.err .dot{background:var(--danger)} .sync.pend .dot{background:var(--warn)}
.sync.err{color:var(--danger)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-width:0}
.stat .v{font-size:22px;font-weight:700;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.stat.good .v{color:var(--ok)} .stat.bad .v{color:var(--danger)}
.hecha{width:100%;margin-top:12px;font-size:17px;background:var(--accent-soft);color:var(--text)}
.hecha.on{background:var(--ok);color:#fff}
.seg{display:flex;gap:8px;margin-top:6px}
.seg .btn{flex:1;background:var(--accent-soft);color:var(--text);padding:10px 8px}
.seg .btn.on{background:var(--accent);color:var(--accent-ink)}
.seg .btn.on.si{background:var(--ok);color:#fff}
.seg .btn.on.no{background:var(--danger);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 12px;min-height:40px;font-size:14px;font-weight:600}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%;
  background:none;color:var(--text);border-radius:0;font-weight:400;justify-content:flex-start;min-height:0}
.cl:first-of-type{border-top:0}
.cl .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin-top:1px}
.cl.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.cl .tx{flex:1;min-width:0}
.cl .tx b{display:block;font-weight:700}
.cl .tx span{font-size:14px;color:var(--muted)}
.pts{margin:6px 0 0;padding-left:20px;font-size:15px}
.pts li{margin:5px 0}
.oprow{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:8px;color:var(--text);font-weight:400;display:block;min-height:0}
.oprow .t{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.oprow .s{font-size:13px;color:var(--muted);margin-top:3px}
.pos{color:var(--ok);font-weight:700} .neg{color:var(--danger);font-weight:700}
.vacio{color:var(--muted);font-size:15px;padding:6px 0}
.ratio{font-weight:700}
.weekpick{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.weekpick .btn{padding:8px 14px;min-height:40px;flex:none}
.weekpick .lbl{flex:1;text-align:center;font-weight:700;min-width:0}
.fase{border-top:1px solid var(--line);padding:10px 0}
.fase:first-of-type{border-top:0}
.fase.on{background:var(--accent-soft);margin:0 -14px;padding:10px 14px;border-radius:10px;border-top:0}
.sep{border-top:1px solid var(--line);margin:12px 0}
body.enpantalla{padding-bottom:0}
body.enpantalla nav.tabbar,body.enpantalla header.top{display:none}
.pantalla{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(8px + env(safe-area-inset-top)) 14px 0}
.pantalla .inner{max-width:640px;margin:0 auto;padding-bottom:16px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.phead h2{font-size:18px;margin:0;flex:1;text-align:center}
.phead .btn{padding:6px 8px;min-height:40px;flex:none;min-width:72px}
.barra{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);margin-top:8px}
.barra .btn{width:100%;font-size:17px;padding:14px}
.aviso{border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;background:var(--warn-soft)}
.aviso.rojo{background:var(--danger-soft);color:var(--text);font-weight:600}
.aviso.info{background:var(--accent-soft)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;
  color:var(--text);border-radius:0;font-weight:400;text-align:left;justify-content:flex-start;min-height:0}
.sw:first-of-type{border-top:0}
.sw .tg{width:46px;height:28px;border-radius:999px;background:var(--line);flex:none;position:relative;transition:background .15s;margin-top:1px}
.sw .tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on .tg{background:var(--ok)} .sw.on .tg::after{left:21px}
.sw .tx{flex:1;min-width:0} .sw .tx b{display:block} .sw .tx span{font-size:14px;color:var(--muted)}
.forzar{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:600;font-size:15px}
.forzar input{width:24px;height:24px;accent-color:var(--danger);flex:none;margin:0}
.opcard{border-top:1px solid var(--line);padding:12px 0}
.opcard:first-of-type{border-top:0;padding-top:2px}
.opcard .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:700}
.opcard .s{font-size:13px;color:var(--muted);margin-top:3px}
.opcard .acc{display:flex;gap:8px;margin-top:10px}
.opcard .acc .btn{flex:1;padding:8px;min-height:40px}
.linkbtn{background:none;color:var(--text);padding:0;min-height:0;border-radius:0;font:inherit;font-weight:700;text-align:left}
.rbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.rbar span{display:block;height:100%;background:var(--ok)}
.rbar.alto span{background:var(--danger)}
.rcuenta{padding:8px 0;border-top:1px solid var(--line)} .rcuenta:first-of-type{border-top:0}
textarea.corto{min-height:60px}
/* Domingo, Cuentas, Métricas y Más */
.pasos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.paso{background:var(--bg);border:1px solid var(--line);color:var(--muted);padding:6px 10px;min-height:34px;font-size:13px;font-weight:600;border-radius:999px}
.paso.hecho{color:var(--ok);border-color:var(--ok)}
.paso.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.navpasos{display:flex;gap:10px;margin-bottom:12px}
.navpasos .btn{flex:1}
.stats.mini{gap:8px;margin:8px 0 4px}
.stats.mini .stat{padding:10px}
.stats.mini .stat .v{font-size:19px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:14px}
.kv div span{display:block;font-size:12px;color:var(--muted);font-weight:600}
table.met{font-size:13px;white-space:nowrap}
table.met th,table.met td{padding:7px 6px;text-align:right}
table.met th:first-child,table.met td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
table.met td.ok{color:var(--ok);font-weight:700} table.met td.ko{color:var(--danger);font-weight:700} table.met td.av{color:var(--warn);font-weight:700}
table.met tr.actual td{background:var(--accent-soft)}
table.met tr.actual td:first-child{background:var(--accent-soft)}
.menu{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;text-align:left;font-weight:400;justify-content:flex-start}
.menu .ic{font-size:26px;line-height:1} .menu b{display:block;font-size:16px} .menu span.s{font-size:13px;color:var(--muted)}
.menu .fl{margin-left:auto;color:var(--muted);font-size:20px}
.volver{margin:-4px 0 8px -8px}
.cal div{margin-top:3px}
@media (max-width:359px){ .f3{grid-template-columns:1fr 1fr} }
</style>

function ponerNotaLocal(fecha, tipo, texto) {

function erroresMes(iso) {

  return [l[0] || '', l[1] || '', l[2] || ''];

function textoErrores(es) { return es.map((e, i) => `${i + 1}) ${e.trim()}`).filter((l) => l.slice(3).trim()).join('\n'); }
function expansionDe(iso) {
  const t = notaDe(iso, 'expansion'), cond = {};
  const mc = t.match(/Condiciones cumplidas:\s*([^\n]*)/);
  if (mc) mc[1].split(',').map((x) => x.trim()).filter((x) => x && x !== 'ninguna').forEach((id) => { cond[id] = true; });
  const md = t.match(/Decisi[oó]n:\s*([^\n]*)/), mn = t.match(/Coste frente a retiros:\s*([\s\S]*)$/);
  return { cond, decision: md && md[1].trim() !== '—' ? md[1].trim() : '', notas: mn ? mn[1].trim() : '' };
}
function textoExpansion(e) {
  const ids = CONDICIONES_EXPANSION.filter((c) => e.cond[c.id]).map((c) => c.id);
  return `Condiciones cumplidas: ${ids.join(', ') || 'ninguna'}\nDecisión: ${e.decision || '—'}\nCoste frente a retiros: ${e.notas || ''}`;
}

function cumplimientoMes(ref) {
  let marcados = 0, si = 0;
  for (let d = new Date(ref.getFullYear(), ref.getMonth(), 1); d <= ref; d = sumarDias(d, 1)) {
    const r = regDe(fechaISO(d));
    if (r.reglas === 'sí' || r.reglas === 'no') { marcados++; if (r.reglas === 'sí') si++; }
  }
  return { marcados, si, pct: marcados ? Math.round(100 * si / marcados) : null };
}

/**
 * Trae la hoja entera y la fusiona con el estado local: manda la hoja, salvo lo
 * que siga pendiente de enviar en la cola. Se llama al abrir la app y cada
 * SYNC_MINUTOS minutos; con un formulario abierto se salta para no repintarlo.
 */
async function traerDeLaHoja(silencioso) {
  if (!configurado()) { if (!silencioso) { sync.msgAjustes = { texto: 'Falta la URL o el token.', err: true }; render(); } return; }
  if (sync.trayendo || (silencioso && state.pantalla)) return;
  sync.trayendo = true;
  if (!silencioso) { sync.msgAjustes = { texto: 'Recuperando…' }; render(); } else pintarSync();
  try {
    const desde = fechaISO(sumarDias(hoy(), -SYNC_DIAS));
    const [dias, ops, cand, cue, est, notas, ret] = await Promise.all([
      llamarScript('GET', { que: 'dias', desde }), llamarScript('GET', { que: 'operaciones' }),
      llamarScript('GET', { que: 'candidatas' }), llamarScript('GET', { que: 'cuentas' }),
      llamarScript('GET', { que: 'estado' }), llamarScript('GET', { que: 'notas' }), llamarScript('GET', { que: 'retiros' })
    ]);
    const pendiente = (k) => state.cola.some((c) => c.k === k);

    (dias.filas || []).forEach((f) => {
      const iso = fechaDeHoja(f.fecha); if (!iso || pendiente('dia:' + iso)) return;
      state.registro[iso] = { rev730: !!f.rev730, ny1530: !!f.ny1530, formacion: !!f.formacion, planificacion: !!f.planificacion,
        reglas: String(f.reglas || ''), reglaIncumplida: String(f.reglaIncumplida || ''), freno: String(f.freno || ''), notas: String(f.notas || '') };
    });
    LS.set('registro', state.registro);

    const opsPend = state.operaciones.filter((o) => pendiente('op:' + o.uid));
    const idsPend = opsPend.map((o) => o.id).filter((x) => x != null);
    state.operaciones = opsPend.concat((ops.filas || []).filter((f) => !idsPend.includes(f.id)).map(opDeHoja).reverse());
    LS.set('operaciones', state.operaciones);

    const candPend = state.candidatas.filter((c) => pendiente('cand:' + c.uid));
    const filasPend = candPend.map((c) => c.fila).filter((x) => x != null);
    state.candidatas = candPend.concat((cand.filas || []).filter((f) => !filasPend.includes(f.fila)).map((f) => ({
      uid: 'hoja-cand-' + f.fila, fila: f.fila, fecha: fechaDeHoja(f.fecha), activo: String(f.activo || ''),
      direccion: String(f.direccion || ''), zona: f.zona, stop: f.stop, tp1: f.tp1, estado: String(f.estado || ''), notas: String(f.notas || '')
    })));
    LS.set('candidatas', state.candidatas);

    const estPend = state.estadoSemanal.filter((x) => pendiente('est:' + x.uid));
    state.estadoSemanal = estPend.concat((est.filas || []).map((f) => ({
      uid: 'hoja-est-' + f.fila, fila: f.fila, fecha: fechaDeHoja(f.fecha), cuenta: String(f.cuenta || '').trim(), balance: f.balance,
      drawdown: f.drawdown, diasRentables: f.diasRentables, proximoRetiro: fechaDeHoja(f.proximoRetiro), progreso: f.progreso, notas: String(f.notas || '')
    })).reverse());
    LS.set('estadoSemanal', state.estadoSemanal);

    state.notas = (notas.filas || []).map((f) => ({ fecha: fechaDeHoja(f.fecha), tipo: String(f.tipo || '').trim(), texto: String(f.texto || '') }))
      .filter((x) => x.fecha && x.tipo);
    state.cola.filter((c) => c.accion === 'nota').forEach((c) => {     // lo pendiente manda sobre la hoja
      const i = state.notas.findIndex((x) => x.fecha === c.datos.fecha && x.tipo === c.datos.tipo);
      if (i >= 0) state.notas[i].texto = c.datos.texto; else state.notas.push({ fecha: c.datos.fecha, tipo: c.datos.tipo, texto: c.datos.texto });
    });
    LS.set('notas', state.notas);

    const retPend = state.retiros.filter((x) => pendiente('ret:' + x.uid));
    state.retiros = retPend.concat((ret.filas || []).map((f) => ({
      uid: 'hoja-ret-' + f.fila, fila: f.fila, fecha: fechaDeHoja(f.fecha), cuenta: String(f.cuenta || '').trim(),
      bruto: f.bruto, reparto: f.reparto, neto: f.neto, metodo: String(f.metodo || ''), notas: String(f.notas || '')
    })).reverse());
    LS.set('retiros', state.retiros);

    state.cuentas = (cue.filas || []).map((f) => Object.assign({}, f, { fechaLimite: fechaDeHoja(f.fechaLimite) }));
    state.cola.filter((c) => c.accion === 'cuenta').forEach((c) => {
      const i = state.cuentas.findIndex((x) => String(x.cuenta).trim() === c.datos.cuenta);
      if (i >= 0) state.cuentas[i] = Object.assign({}, state.cuentas[i], c.datos); else state.cuentas.push(Object.assign({}, c.datos));
    });
    LS.set('cuentas', state.cuentas);

    sync.ultimaHoja = Date.now(); LS.set('ultimaHoja', sync.ultimaHoja); sync.error = '';
    if (!silencioso) {
      sync.msgAjustes = { texto: `Recuperado de la hoja: ${(dias.filas || []).length} día(s), ${(ops.filas || []).length} operación(es), ` +
        `${(cand.filas || []).length} candidata(s), ${cuentasEfectivas().length} cuenta(s), ${(est.filas || []).length} estado(s) semanales, ` +
        `${state.notas.length} nota(s) y ${(ret.filas || []).length} retiro(s).` };
    }
  } catch (e) {
    if (silencioso) sync.error = errorLegible(e);
    else sync.msgAjustes = { texto: 'Error: ' + errorLegible(e), err: true };
  }
  sync.trayendo = false;
  if (state.pantalla) pintarSync(); else render();
}
function recuperarDeLaHoja() { return traerDeLaHoja(false); }

function exportarJSON() {
  const out = { app: 'trading2627', version: 1, fecha: new Date().toISOString(), datos: {} };
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('trading2627:')) out.datos[k] = localStorage.getItem(k); } } catch (e) {}
  return JSON.stringify(out, null, 2);
}
function descargarCopia() {
  try {
    const blob = new Blob([exportarJSON()], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `trading-2627-copia-${fechaISO(new Date())}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    sync.msgCopia = { texto: 'Copia generada. Guárdala en Archivos, Drive o mándatela por correo.' };
  } catch (e) { sync.msgCopia = { texto: 'No se pudo generar la copia: ' + errorLegible(e), err: true }; }
  render();
}
function leerCopia(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o || o.app !== 'trading2627' || !o.datos || typeof o.datos !== 'object') throw new Error('el fichero no es una copia de Trading 26/27');
      sync.importPendiente = { datos: o.datos, n: Object.keys(o.datos).length, fecha: o.fecha ? new Date(o.fecha).toLocaleString('es-ES') : 'fecha desconocida' };
      sync.msgCopia = null;
    } catch (e) { sync.importPendiente = null; sync.msgCopia = { texto: 'Error: ' + errorLegible(e), err: true }; }
    render();
  };
  fr.onerror = () => { sync.msgCopia = { texto: 'No se pudo leer el fichero.', err: true }; render(); };
  fr.readAsText(file);
}
function aplicarImportacion() {
  const imp = sync.importPendiente; if (!imp) return;
  try {
    Object.keys(localStorage).filter((k) => k.startsWith('trading2627:')).forEach((k) => localStorage.removeItem(k));
    Object.entries(imp.datos).forEach(([k, v]) => { if (k.startsWith('trading2627:') && typeof v === 'string') localStorage.setItem(k, v); });
  } catch (e) { sync.importPendiente = null; sync.msgCopia = { texto: 'No se pudo restaurar: ' + errorLegible(e), err: true }; render(); return; }
  location.reload();
}

function resumenBacktest(estrategia) {
  const xs = state.backtest.filter((x) => !estrategia || x.estrategia === estrategia), rs = xs.map((x) => num(x.resultadoR)).filter((v) => v !== '');
  const total = rs.reduce((a, b) => a + b, 0);
  let racha = 0, peor = 0;
  xs.slice().reverse().forEach((x) => { const r = num(x.resultadoR); if (r !== '' && r < 0) { racha++; peor = Math.max(peor, racha); } else if (r !== '') racha = 0; });
  const ok = xs.filter((x) => x.checklist === 'sí').length;
  return { n: xs.length, total, media: rs.length ? total / rs.length : null, peor, ok };
}

      guardarRegistro(f, { [k]: nuevo });
      if (k === 'planificacion' && nuevo) { const cs = candidatasSinEntrada(f); state.pasar = cs.length ? { fecha: f, uids: cs.map((c) => c.uid) } : null; }
      if (k === 'planificacion' && !nuevo) state.pasar = null;
      render(); encolarDia(f, { [k]: nuevo }); break;
    }
    case 'pasarSi': pasarCandidatas(); render(); break;
    case 'pasarNo': state.pasar = null; render(); break;
    case 'reglas': {
      const nuevo = reg.reglas === v ? '' : v;
      guardarRegistro(iso, { reglas: nuevo }); render();
      encolarDia(iso, { reglas: nuevo, reglaIncumplida: nuevo === 'no' ? (reg.reglaIncumplida || '') : '' }); break;
    }
    case 'freno': {
      const nuevo = reg.freno === v ? '' : v;
      guardarRegistro(iso, { freno: nuevo }); render(); encolarDia(iso, { freno: nuevo }); break;
    }
    // Operaciones
    case 'nuevaOp': abrirNuevaOp(); break;
    case 'editarOp': {
      const o = opDe(el.dataset.uid); if (!o) break;
      state.pantalla = { tipo: 'op', o: JSON.parse(JSON.stringify(o)), riesgoAuto: false, forzar: false, motivoForzado: '', activoOtro: !ACTIVOS.includes(o.activo) };
      guardarPantalla(); render(); break;
    }
    case 'gestionar': state.pantalla = { tipo: 'gestion', uid: el.dataset.uid, fecha: fechaISO(hoy()), accion: 'cierre parcial', pct: '', motivo: '', nota: '' }; guardarPantalla(); render(); break;
    case 'cerrar': {
      const o = opDe(el.dataset.uid); if (!o) break;
      state.pantalla = { tipo: 'cierre', uid: o.uid, fechaCierre: fechaISO(hoy()), salida: '', resultadoR: '', rManual: false,
        dentroReglas: o.dentroReglas || '', motivo: o.motivo || '', aprendizaje: o.aprendizaje || '' };
      guardarPantalla(); render(); break;
    }
    // Pantalla: operación
    case 'pCancelar': cerrarPantalla(); break;
    case 'pTipo':
      p.o.tipo = v; p.o.cuentas = cuentasDeTipo(v);
      recalcularRiesgo(p); guardarPantalla(); render(); break;
    case 'pDir': p.o.direccion = v; guardarPantalla(); render(); break;
    case 'pCuenta': {
      const cs = p.o.cuentas || [];
      p.o.cuentas = cs.includes(v) ? cs.filter((x) => x !== v) : nombresParaChips().filter((c) => c === v || cs.includes(c));
      recalcularRiesgo(p); guardarPantalla(); render(); break;
    }
    case 'pCheck': { const id = el.dataset.id; p.o[id] = !p.o[id]; guardarPantalla(); render(); break; }
    case 'pRiesgo': p.o.riesgo = fmtRiesgo(Number(v)); p.riesgoAuto = false; guardarPantalla(); render(); break;
    case 'peReglas': p.o.dentroReglas = p.o.dentroReglas === v ? '' : v; guardarPantalla(); render(); break;
    case 'pGuardar': {
      const val = validarOp(p); if (!val.puede) { pintarPantalla(); break; }
      const o = p.o, nueva = !opDe(o.uid);
      o.activo = String(o.activo).trim().toUpperCase();
      if (nueva && val.blandos.length) {
        o.dentroReglas = 'no';
        o.motivo = 'Apertura: ' + val.blandos.join('; ') + ' — ' + String(p.motivoForzado).trim();
      }
      guardarOperacion(o);
      if (p.candUid) { const c = state.candidatas.find((x) => x.uid === p.candUid); if (c) { c.estado = 'entrada'; guardarCandidata(c); } }
      state.tab = 'operaciones'; cerrarPantalla(); break;
    }
    // Pantalla: gestión
    case 'gAccion': p.accion = v; guardarPantalla(); render(); break;
    case 'gMotivo': p.motivo = p.motivo === v ? '' : v; guardarPantalla(); render(); break;
    case 'gGuardar': {
      const o = opDe(p.uid); if (!o || !gestionValida(p)) break;
      o.gestion = (String(o.gestion || '').trim() ? String(o.gestion).trim() + '\n' : '') + lineaGestion(p);
      if (p.accion === 'break even') o.be = true;
      guardarOperacion(o, ['gestion']); cerrarPantalla(); break;
    }
    // Pantalla: cierre
    case 'cReglas': p.dentroReglas = p.dentroReglas === v ? '' : v; guardarPantalla(); render(); break;
    case 'cGuardar': {
      const o = opDe(p.uid); if (!o || !cierreValido(p)) break;
      const campos = ['fechaCierre', 'resultadoR', 'dentroReglas', 'motivo', 'aprendizaje'];
      if (num(p.salida) !== '') { o.gestion = (String(o.gestion || '').trim() ? String(o.gestion).trim() + '\n' : '') + `${p.fechaCierre}: cierre a ${p.salida}`; campos.push('gestion'); }
      Object.assign(o, { fechaCierre: p.fechaCierre, resultadoR: p.resultadoR, dentroReglas: p.dentroReglas,
        motivo: p.dentroReglas === 'no' ? String(p.motivo).trim() : (o.motivo || ''), aprendizaje: p.aprendizaje });
      guardarOperacion(o, campos); cerrarPantalla(); break;
    }
    // Candidatas
    case 'sem': state.semanaSel = Math.min(ULTIMA_SEMANA, Math.max(1, semanaSel() + parseInt(el.dataset.d, 10))); render(); break;
    case 'semHoy': state.semanaSel = null; render(); break;
    case 'nuevaCand':
      state.pantalla = { tipo: 'cand', c: { uid: uid(), fecha: fechaISO(domingoDeSemana(semanaSel())), activo: '', direccion: 'largo', zona: '', stop: '', tp1: '', estado: 'pendiente', notas: '' }, activoOtro: false };
      guardarPantalla(); render(); break;
    case 'editarCand': {
      const c = state.candidatas.find((x) => x.uid === el.dataset.uid); if (!c) break;
      state.pantalla = { tipo: 'cand', c: JSON.parse(JSON.stringify(c)), activoOtro: !ACTIVOS.includes(c.activo) }; guardarPantalla(); render(); break;
    }
    case 'candEstado': { const c = state.candidatas.find((x) => x.uid === el.dataset.uid); if (c) { c.estado = v; guardarCandidata(c); render(); } break; }
    case 'convertir': {
      const c = state.candidatas.find((x) => x.uid === el.dataset.uid); if (!c) break;
      abrirNuevaOp({ activo: c.activo, direccion: c.direccion || 'largo', entrada: c.zona, stop: c.stop, tp1: c.tp1 }, c.uid); break;
    }
    case 'pcDir': p.c.direccion = v; guardarPantalla(); render(); break;
    case 'pcEstado': p.c.estado = v; guardarPantalla(); render(); break;
    case 'pcGuardar': {
      if (!String(p.c.activo || '').trim()) break;
      p.c.activo = String(p.c.activo).trim().toUpperCase(); guardarCandidata(p.c); cerrarPantalla(); break;
    }
    case 'addEst': {
      guardarEstadoSemanal(Object.assign({ uid: uid(), fecha: fechaISO(domingoDeSemana(semanaSel())) }, borradores.est));
      borradores.est = null; render(); break;
    }
    case 'traerCuentas': probarConexion(); break;
    // Plan
    case 'btEstr': borradores.bt.estrategia = v; render(); break;
    case 'btCheck': borradores.bt.checklist = v; render(); break;
    case 'addBt': {
      const b = borradores.bt;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(b.fecha || '')) break;
      guardarBacktest(Object.assign({ uid: uid() }, b)); borradores.bt = null; render(); break;
    }
    case 'btDir': borradores.bt.direccion = v; render(); break;
    // Domingo
    case 'domPaso': case 'domMover': {
      const d = domingoRef(), dd = datosDomingo(fechaISO(d)), n = pasosDomingo(d).length;
      dd.paso = el.dataset.act === 'domPaso' ? +el.dataset.i : Math.max(0, Math.min(n - 1, (dd.paso || 0) + parseInt(el.dataset.d, 10)));
      guardarDomingo(); render(); window.scrollTo(0, 0); break;
    }
    case 'domGuardarCuenta': {
      const d = domingoRef(), iso = fechaISO(d), dd = datosDomingo(iso), nombre = el.dataset.c;
      const c = cuentasEfectivas().find((x) => String(x.cuenta).trim() === nombre), b = dd.cuentas[nombre] || {};
      if (!c || numDinero(b.balance) === '') { const x = document.querySelector(`input[data-c="${CSS.escape(nombre)}"][data-f="balance"]`); if (x) x.focus(); break; }
      if (state.estadoSemanal.some((x) => x.fecha === iso && x.cuenta === nombre)) break;
      const prog = String(b.progreso || '').trim() !== '' ? b.progreso : progresoCalculado(c, b.balance);
      guardarEstadoSemanal({ uid: uid(), fecha: iso, cuenta: nombre, balance: b.balance, drawdown: b.drawdown || '', diasRentables: b.diasRentables || '',
        proximoRetiro: b.proximoRetiro || '', progreso: prog == null ? '' : String(prog).replace('.', ','), notas: '' });
      delete dd.cuentas[nombre]; guardarDomingo(); render(); break;
    }
    case 'domCand': state.semanaSel = semanaPlan(domingoRef()); state.tab = 'candidatas'; render(); break;
    case 'domNuevaCand':
      state.pantalla = { tipo: 'cand', c: { uid: uid(), fecha: fechaISO(domingoRef()), activo: '', direccion: 'largo', zona: '', stop: '', tp1: '', estado: 'pendiente', notas: '' }, activoOtro: false };
      guardarPantalla(); render(); break;
    case 'expCond': {
      const iso = fechaISO(domingoRef()), e = expansionDe(iso);
      e.cond[el.dataset.id] = !e.cond[el.dataset.id];
      guardarNota(iso, 'expansion', textoExpansion(e)); render(); break;
    }
    case 'expDecision': {
      const iso = fechaISO(domingoRef()), e = expansionDe(iso);
      e.decision = e.decision === v ? '' : v;
      guardarNota(iso, 'expansion', textoExpansion(e)); render(); break;
    }
    // Cuentas
    case 'nuevaCuenta': {
      const k = {}; CAMPOS_CUENTA.forEach((f) => { k[f] = ''; });
      Object.assign(k, { firma: 'Orion Funded', producto: '', fase: 'challenge', estado: 'en curso', uso: 'swing' });
      state.pantalla = { tipo: 'cuenta', cuenta: '', k }; guardarPantalla(); render(); break;
    }
    case 'editarCuenta': {
      const c = cuentaDe(el.dataset.c); if (!c) break;
      const k = {}; CAMPOS_CUENTA.forEach((f) => { k[f] = c[f] == null ? '' : String(c[f]); });
      k.fechaLimite = fechaDeHoja(c.fechaLimite);
      if (num(k.riesgoDefecto) === '') k.riesgoDefecto = fmtRiesgo(riesgoDefectoCuenta(c.cuenta));
      state.pantalla = { tipo: 'cuenta', cuenta: c.cuenta, k }; guardarPantalla(); render(); break;
    }
    case 'pkSet': p.k[el.dataset.f] = p.k[el.dataset.f] === v ? '' : v; guardarPantalla(); render(); break;
    case 'pkUso': p.k.uso = v; guardarPantalla(); render(); break;
    case 'cuentaGuardar': {
      const c = {}; CAMPOS_CUENTA.forEach((f) => { c[f] = p.k[f] == null ? '' : String(p.k[f]).trim(); });
      c.cuenta = String(p.k.cuenta || p.cuenta).trim();
      if (!c.cuenta) break;
      guardarCuentaHoja(c); state.tab = 'cuentas'; cerrarPantalla(); break;
    }
    case 'ctaEstado': { const c = cuentaDe(el.dataset.c); if (c) { guardarCuentaHoja({ cuenta: c.cuenta, estado: v }); render(); } break; }
    case 'rellenarRiesgos': {
      cuentasEfectivas().filter((c) => num(c.riesgoDefecto) === '')
        .forEach((c) => guardarCuentaHoja({ cuenta: c.cuenta, riesgoDefecto: fmtRiesgo(riesgoDefectoCuenta(c.cuenta)) }));
      render(); break;
    }
    // Retiros
    case 'nuevoRetiro':
      state.pantalla = { tipo: 'retiro', cuenta: el.dataset.c, fecha: fechaISO(hoy()), bruto: '', reparto: fmtRiesgo(REPARTO_DEFECTO),
        neto: '', metodo: '', notas: '' };
      guardarPantalla(); render(); break;
    case 'retMetodo': p.metodo = p.metodo === v ? '' : v; guardarPantalla(); render(); break;
    case 'retGuardar': {
      const calc = netoRetiro(p), neto = numDinero(p.neto) !== '' ? p.neto : (calc === '' ? '' : fmtRiesgo(calc));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(p.fecha || '') || neto === '') break;
      guardarRetiro({ uid: uid(), fecha: p.fecha, cuenta: p.cuenta, bruto: p.bruto, reparto: p.reparto, neto: neto, metodo: p.metodo, notas: p.notas });
      state.tab = 'cuentas'; cerrarPantalla(); break;
    }
    // Ajustes y sincronización
    case 'tema': state.tema = v; LS.set('tema', state.tema); aplicarTema(); render(); break;
    case 'sync': if (!configurado()) { state.tab = 'ajustes'; render(); } else { if (!state.cola.length) sync.error = ''; sincronizar(); } break;
    case 'cfgProbar': probarConexion(); break;
    case 'recuperar': recuperarDeLaHoja(); break;
    case 'exportar': descargarCopia(); break;
    case 'importOk': aplicarImportacion(); break;
    case 'importNo': sync.importPendiente = null; render(); break;
  }
});

// Escribir en un campo no repinta la vista: solo actualiza el estado y las partes vivas.
function alEscribir(t) {
  const o = t.dataset.o, f = t.dataset.f, p = state.pantalla;
  // Los campos de la hoja Notas llevan data-tipo en vez de data-f.
  if (o === 'nota') {
    const iso = fechaISO(domingoRef()), tipo = t.dataset.tipo;
    if (tipo === 'mensual') { const es = erroresMes(iso); es[+t.dataset.i] = t.value; ponerNotaLocal(iso, 'mensual', textoErrores(es)); }
    else if (tipo === 'expansion') { const e = expansionDe(iso); e.notas = t.value; ponerNotaLocal(iso, 'expansion', textoExpansion(e)); }
    else ponerNotaLocal(iso, tipo, t.value);
    return true;
  }
  if (o && f) {
    if (p && (o === 'po' || o === 'pc' || o === 'p' || o === 'pk')) {
      const obj = o === 'po' ? p.o : o === 'pc' ? p.c : o === 'pk' ? p.k : p;
      obj[f] = t.value;
      if (o === 'po' && f === 'riesgo') p.riesgoAuto = false;
      if (o === 'po' && (f === 'fechaApertura')) recalcularRiesgo(p);
      if (p.tipo === 'cierre' && f === 'salida' && !p.rManual) {
        const op = opDe(p.uid), rs = op ? rDeSalida(op, p.salida) : null;
        p.resultadoR = rs == null ? '' : fmtRiesgo(Math.round(rs * 100) / 100);
        const campoR = $('#cR'); if (campoR) campoR.value = p.resultadoR;
      }
      if (p.tipo === 'cierre' && f === 'resultadoR') p.rManual = t.value.trim() !== '';
      guardarPantalla(); pintarPantalla();
    } else if (o === 'domc') {
      const dd = datosDomingo(fechaISO(domingoRef()));
      {
        const c = t.dataset.c; dd.cuentas[c] = Object.assign({}, dd.cuentas[c], { [f]: t.value });
        if (f === 'balance') {
          const cu = cuentasEfectivas().find((x) => String(x.cuenta).trim() === c), el = document.querySelector(`[data-prog="${CSS.escape(c)}"]`);
          if (cu && el) el.textContent = textoProg(progresoCalculado(cu, t.value));
        }
      }
      guardarDomingo();
    } else if (o === 'reg') {
      guardarRegistro(fechaISO(fechaTab()), { [f]: t.value });
    } else if (borradores[o]) {
      borradores[o][f] = t.value;
    }
    return true;
  }
  if (t.dataset.scalp != null) {
    state.ajustes.checklistScalping[+t.dataset.scalp] = t.value; LS.set('ajustes', state.ajustes); return true;
  }
  if (t.id === 'cfgUrl' || t.id === 'cfgToken') {
    state.ajustes[t.id === 'cfgUrl' ? 'url' : 'token'] = t.value.trim(); LS.set('ajustes', state.ajustes); pintarSync(); return true;
  }
  return false;
}
$('#view').addEventListener('input', (e) => { alEscribir(e.target); });
$('#view').addEventListener('change', (e) => {
  const t = e.target, p = state.pantalla;
  if (t.dataset.activo && p) {
    const obj = t.dataset.activo === 'po' ? p.o : p.c;
    p.activoOtro = t.value === 'otro'; obj.activo = t.value === 'otro' ? '' : t.value;
    guardarPantalla(); render();
    if (p.activoOtro) { const x = $(`input[data-o="${t.dataset.activo}"][data-f="activo"]`); if (x) x.focus(); }
    return;
  }
  if (t.id === 'pForzar' && p) { p.forzar = t.checked; guardarPantalla(); pintarPantalla(); return; }
  if (t.id === 'cfgFase') { state.ajustes.fase = parseInt(t.value, 10) || 0; LS.set('ajustes', state.ajustes); render(); return; }
  if (t.id === 'importFile') { leerCopia(t.files && t.files[0]); t.value = ''; return; }
  if (t.id === 'cfgUrl' || t.id === 'cfgToken') { sync.error = ''; sync.msgAjustes = null; sincronizar(); return; }
  alEscribir(t);
  if (t.dataset.o === 'reg') encolarDia(fechaISO(fechaTab()), { [t.dataset.f]: t.value });
  if (t.dataset.o === 'nota') { const iso = fechaISO(domingoRef()), tipo = t.dataset.tipo; guardarNota(iso, tipo, notaDe(iso, tipo)); }
  if (t.dataset.o === 'po' && t.dataset.f === 'fechaApertura') render();   // el aviso de viernes depende de la fecha
});
$('#view').addEventListener('toggle', (e) => { const d = e.target; if (d.dataset && d.dataset.k) abiertosDet[d.dataset.k] = d.open; }, true);
$('#view').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input[data-o="reg"]')) { e.preventDefault(); e.target.blur(); }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!state.pantalla) render();
  sincronizar();
  const m = haceMinutos(sync.ultimaHoja);
  if (m == null || m >= SYNC_MINUTOS) traerDeLaHoja(true);
});
window.addEventListener('online', () => { sincronizar(); traerDeLaHoja(true); });

render();
sincronizar();
traerDeLaHoja(true);                                   // al abrir
setInterval(() => traerDeLaHoja(true), SYNC_MINUTOS * 60000);

// --- PWA: service worker (solo bajo http/https, no con file://) -------------
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
